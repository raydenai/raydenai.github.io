name: Deploy AURA demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate block sequence
        run: pnpm lint:blocks

      - name: Validate Astro types
        run: pnpm check

      - name: Set up Python for asset validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image-validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Verify image integrity
        run: pnpm verify:images

      - name: Build production site
        run: pnpm build
        env:
          # Set these GitHub repository variables only after the domain and form
          # provider have been approved. Both values are public static config;
          # never place a provider API secret in this workflow.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://raydenai.github.io' }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT || '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
