architecture: private-signal
decision_status: approved
selected_because: The core value is selective, confidential, decision-led advisory work. The site must earn a qualified private conversation rather than collect high-volume leads.
rejected_alternatives:
  - proof-machine: The concept has no permissioned public results that justify evidence-led operational design.
  - creator-education: A broad program ladder would distract from the high-touch advisory motion.
visual_direction: Private Signal — cinematic private-room editorial authority in obsidian, parchment, aged brass, and dark walnut.
primary_conversion: private_conversation
proof_posture: Use concept-safe method and confidentiality policy until client evidence is approved.
